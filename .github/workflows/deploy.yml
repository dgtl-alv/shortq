name: Deploy

on:
  push:
    branches: [main]
    tags: ['prod-*']

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy-staging:
    name: deploy staging
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: shortq-staging
      cancel-in-progress: true
    steps:
      - name: Install SSH key
        env:
          DEPLOY_KEY: *** secrets.SHORTQ_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.SHORTQ_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.SHORTQ_DEPLOY_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/shortq_deploy
          chmod 600 ~/.ssh/shortq_deploy
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy staging over SSH
        env:
          DEPLOY_HOST: ${{ secrets.SHORTQ_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.SHORTQ_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.SHORTQ_DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/shortq_deploy \
            -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "SHORTQ_DEPLOY_ENV=staging SHORTQ_DEPLOY_REF=main SHORTQ_APP_DIR=/opt/alva/apps/staging/shortq /opt/alva/apps/staging/shortq/scripts/deploy.sh"

  deploy-production:
    name: deploy production
    needs: ci
    if: startsWith(github.ref, 'refs/tags/prod-')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: shortq-production
      cancel-in-progress: false
    steps:
      - name: Validate production tag
        env:
          DEPLOY_TAG: ${{ github.ref_name }}
        run: |
          [[ "$DEPLOY_TAG" =~ ^prod-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]+$ ]]

      - name: Install SSH key
        env:
          DEPLOY_KEY: *** secrets.SHORTQ_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.SHORTQ_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.SHORTQ_DEPLOY_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/shortq_deploy
          chmod 600 ~/.ssh/shortq_deploy
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy production tag over SSH
        env:
          DEPLOY_HOST: ${{ secrets.SHORTQ_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.SHORTQ_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.SHORTQ_DEPLOY_USER }}
          DEPLOY_TAG: ${{ github.ref_name }}
        run: |
          ssh -i ~/.ssh/shortq_deploy \
            -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "SHORTQ_DEPLOY_ENV=production SHORTQ_DEPLOY_REF=$DEPLOY_TAG SHORTQ_APP_DIR=/opt/alva/apps/prod/shortq /opt/alva/apps/prod/shortq/scripts/deploy.sh"
