name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: shortq-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy production
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        env:
          DEPLOY_KEY: ${{ secrets.SHORTQ_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.SHORTQ_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.SHORTQ_DEPLOY_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/shortq_deploy
          chmod 600 ~/.ssh/shortq_deploy
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.SHORTQ_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.SHORTQ_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.SHORTQ_DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/shortq_deploy \
            -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "SHORTQ_APP_DIR=/opt/alva/apps/prod/shortq /opt/alva/apps/prod/shortq/scripts/deploy.sh"
