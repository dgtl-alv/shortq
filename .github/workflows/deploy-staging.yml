name: Deploy staging

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: shortq-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, shortq-staging]
    environment: staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Deploy immutable main SHA
        env:
          DEPLOY_SHA: ${{ github.sha }}
          APP_DIR: /opt/alva/apps/staging/shortq
          COMPOSE_FILE: docker-compose.staging.yml
          PROJECT_NAME: shortq-staging
          HEALTH_URL: http://127.0.0.1:18081/healthz
        run: scripts/deploy.sh
