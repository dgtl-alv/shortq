name: Validate production release

on:
  push:
    tags:
      - 'prod-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-*'

permissions:
  contents: read

concurrency:
  group: shortq-production
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Validate release tag and commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^prod-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]+$ ]]
          git fetch --force origin main
          sha="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git merge-base --is-ancestor "$sha" origin/main
          printf 'validated production release %s at %s\n' "$GITHUB_REF_NAME" "$sha"
