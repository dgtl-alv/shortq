name: CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shortq_test
          POSTGRES_USER: shortq
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shortq -d shortq_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://shortq:ci-only-password@127.0.0.1:5432/shortq_test?sslmode=disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.1.0
        with:
          go-version: "1.23"
          cache: true
      - name: Validate formatting
        run: test -z "$(find . -name '*.go' -not -path './.git/*' -exec gofmt -l {} +)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Validate JavaScript
        run: node --check web/app.js
      - name: Validate deployment scripts
        run: bash -n scripts/*.sh
      - name: Validate Compose
        env:
          DATABASE_URL: postgres://shortq:ci-only-password@db:5432/shortq?sslmode=disable
          POSTGRES_DB: shortq
          POSTGRES_USER: shortq
          POSTGRES_PASSWORD: ci-only-password
          JWT_SECRET: ci-session-secret-at-least-32-characters
          SUPERADMIN_EMAIL: "[EMAIL_HASH:5e693925f035]"
          SUPERADMIN_PASSWORD: ci-password-at-least-16
        run: |
          touch .env
          docker compose config --quiet
      - name: Check whitespace
        run: git diff --check
