name: PR validation

on:
  workflow_call:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shortq_test
          POSTGRES_USER: shortq
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shortq -d shortq_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://shortq:ci-only-password@127.0.0.1:5432/shortq_test?sslmode=disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026fd4c3f9f4a9f5c4a # v5.0.2
        with:
          go-version: "1.23"
          cache: true
      - name: Validate formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './.git/*'))"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Validate JavaScript
        run: node --check web/app.js
      - name: Validate deployment scripts
        run: bash -n scripts/*.sh
      - name: Validate Compose
        env:
          DATABASE_URL: postgres://shortq:ci-only-password@db:5432/shortq?sslmode=disable
          POSTGRES_DB: shortq
          POSTGRES_USER: shortq
          POSTGRES_PASSWORD: ci-only-password
          JWT_SECRET: ci-session-secret-at-least-32-characters
          SUPERADMIN_EMAIL: ci@example.invalid
          SUPERADMIN_PASSWORD: ci-password-at-least-16
        run: docker compose config --quiet
      - name: Check whitespace
        run: git diff --check
