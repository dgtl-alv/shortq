name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Check gofmt
        run: |
          files="$(gofmt -l $(find . -name '*.go' -not -path './.git/*'))"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Go test
        run: go test ./...

      - name: Check JavaScript syntax
        run: node --check web/app.js

      - name: Check whitespace
        run: git diff --check

      - name: Validate Docker Compose
        run: |
          cat > .env <<'EOF'
          DB_DSN=shortq:shortqpass@tcp(db:3306)/shortq?parseTime=true
          BASE_URL=http://localhost:8080
          SESSION_SECRET=ci-session-secret
          SUPERADMIN_EMAIL=ci@example.com
          SUPERADMIN_PASSWORD=ci-password
          OIDC_ISSUER_URL=https://login.microsoftonline.com/common/v2.0
          OIDC_CLIENT_ID=ci-client-id
          OIDC_CLIENT_SECRET=ci-client-secret
          OIDC_REDIRECT_URL=http://localhost:8080/auth/microsoft/callback
          EOF
          docker compose -f docker-compose.yml config --quiet
          rm -f .env
