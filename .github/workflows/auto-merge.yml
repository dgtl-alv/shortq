name: Auto-merge green PRs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Merge eligible PR and validate main
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          pulls="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,isDraft,baseRefName,headRefOid,isCrossRepository)"
          pr_number="$(jq -r --arg sha "$HEAD_SHA" \
            '[.[] | select(.headRefOid == $sha and .baseRefName == "main" and .isDraft == false and .isCrossRepository == false)] | first | .number // empty' \
            <<<"$pulls")"
          if [[ -z "$pr_number" ]]; then
            echo "No eligible open PR for successful CI SHA $HEAD_SHA"
            exit 0
          fi
          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          test "$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" = "MERGED"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
