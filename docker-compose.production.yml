services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      SERVER_HOSTNAME: ${SERVER_HOSTNAME:-unknown}
      DEPLOY_TAG: ${DEPLOY_TAG:-unknown}
      APP_BASE_URL: https://s.alvaauto.com
      REDIRECT_CACHE_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      REDIRECT_CACHE_TIMEOUT: 250ms
      CLICK_QUEUE_ENABLED: "false"
    ports:
      - "127.0.0.1:${SHORTQ_PORT:-8000}:8080"
  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 192m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
