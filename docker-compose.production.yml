services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      SERVER_HOSTNAME: ${SERVER_HOSTNAME:-unknown}
      DEPLOY_TAG: ${DEPLOY_TAG:-unknown}
      APP_BASE_URL: https://s.alvaauto.com
    ports:
      - "127.0.0.1:${SHORTQ_PORT:-8000}:8080"
