services:
  app:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shortq
      POSTGRES_USER: shortq
      POSTGRES_PASSWORD: ${SHORTQ_POSTGRES_PASSWORD:-shortqpass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortq -d shortq"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
