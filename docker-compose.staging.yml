services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      APP_BASE_URL: https://internal.alvaauto.com
    ports:
      - "127.0.0.1:${SHORTQ_PORT:-8000}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shortq
      POSTGRES_USER: shortq
      POSTGRES_PASSWORD: ${SHORTQ_POSTGRES_PASSWORD:?SHORTQ_POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortq -d shortq"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
